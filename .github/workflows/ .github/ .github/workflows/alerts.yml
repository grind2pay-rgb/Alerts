name: wickless-alerts

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      tol:
        description: "Tolerance (0 = normal, 1 = test)"
        default: "0"

permissions:
  contents: write

concurrency:
  group: alerts
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance pandas requests
      - run: python wickless_cloud.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TOL: ${{ github.event.inputs.tol || '0' }}
      - name: Save state
        run: |
          git config user.name "alerts-bot"
          git config user.email "alerts-bot@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || (git commit -m "update state" && git push)
